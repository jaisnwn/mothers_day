<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mother's Day</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(to bottom,#f8e8ff,#fff0f5);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
text-align:center;
padding:30px;
width:90%;
max-width:400px;
background:white;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
animation:fadeIn 2s ease;
position:relative;
z-index:2;
}

.small{
color:#b57edc;
letter-spacing:3px;
font-size:14px;
margin-bottom:10px;
}

h1{
font-size:45px;
color:#333;
line-height:1.2;
}

p{
margin-top:20px;
color:#666;
font-size:18px;
}

button{
margin-top:30px;
padding:15px 30px;
border:none;
border-radius:50px;
background:#b57edc;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.message{
display:none;
margin-top:25px;
color:#444;
font-size:18px;
animation:fadeIn 1s ease;
}

.heart{
position:absolute;
color:pink;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-100vh) scale(1.5);
opacity:0;
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="container">
<div class="small">🌸 TO THE BEST MOM EVER 🌸</div>

<h1>Happy<br>Mother’s Day<br>Mummy! 🤍</h1>

<p>
Thank you for loving me, supporting me,
and always believing in me.
</p>

<button onclick="showMessage()">Open Your Surprise 🎁</button>

<div class="message" id="message">
Mummy, one day I’ll make you proud and give you everything you deserve 🤍
</div>
</div>

<script>
function showMessage(){
document.getElementById("message").style.display="block";
}

for(let i=0;i<25;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="🤍";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*5)+"s";
heart.style.fontSize=(15+Math.random()*25)+"px";

document.body.appendChild(heart);
}
</script>

</body>
</html>
